<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">BJMP — Ícone do aplicativo</title>
  <desc id="desc">Ícone quadrado da BJMP com o monograma BJMP e órbita azul.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061B42"/>
      <stop offset=".52" stop-color="#03102B"/>
      <stop offset="1" stop-color="#010817"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0055FF"/>
      <stop offset=".55" stop-color="#008CFF"/>
      <stop offset="1" stop-color="#12D9FF"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#E7ECF3"/>
      <stop offset="1" stop-color="#AEB9C8"/>
    </linearGradient>

    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- App background -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="url(#bg)"/>

  <!-- luminous border -->
  <rect x="28" y="28" width="968" height="968" rx="216"
        fill="none" stroke="url(#blue)" stroke-width="10" opacity=".95"
        filter="url(#glow)"/>

  <!-- upper orbital arc -->
  <path d="M330 365
           C485 215 735 190 865 285
           C915 321 928 374 905 425
           C916 337 846 292 752 275
           C600 248 455 292 330 365Z"
        fill="url(#blue)" filter="url(#glow)"/>

  <!-- lower orbital arc -->
  <path d="M116 605
           C165 800 505 875 820 710
           C610 780 335 775 190 650
           C150 616 126 579 116 605Z"
        fill="url(#blue)" filter="url(#glow)"/>

  <!-- BJMP monogram -->
  <g font-family="Arial, Helvetica, sans-serif"
     font-weight="800"
     font-size="330"
     letter-spacing="-30"
     filter="url(#shadow)">
    <text x="105" y="635" fill="url(#silver)">B</text>
    <text x="350" y="635" fill="url(#blue)">J</text>
    <text x="505" y="635" fill="url(#silver)">N</text>
    <text x="775" y="635" fill="url(#silver)">P</text>
  </g>

  <!-- geometric blue accent -->
  <path d="M675 410 L748 482 L704 532 L630 458 Z" fill="url(#blue)"/>
  <path d="M704 532 L770 459 L808 501 L739 575 Z" fill="#08D8FF" opacity=".9"/>

  <!-- subtle highlight -->
  <path d="M165 175 Q510 70 860 180" fill="none"
        stroke="#FFFFFF" stroke-width="3" opacity=".08"/>
</svg>
