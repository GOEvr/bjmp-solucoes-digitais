<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="title desc">
  <title id="title">Símbolo BJMP</title>
  <desc id="desc">Símbolo isolado da marca BJMP, com monograma geométrico e órbita azul.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0055FF"/>
      <stop offset=".55" stop-color="#008CFF"/>
      <stop offset="1" stop-color="#12D9FF"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#E2E7EE"/>
      <stop offset="1" stop-color="#AEB8C6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Orbital swoosh -->
  <path d="M92 435
           C145 565 390 615 575 505
           C405 548 205 535 125 432
           C101 401 82 409 92 435Z"
        fill="url(#blue)" filter="url(#glow)"/>

  <path d="M255 210
           C375 105 560 105 606 208
           C626 252 610 294 578 320
           C600 237 552 181 476 161
           C397 140 326 161 255 210Z"
        fill="url(#blue)" filter="url(#glow)"/>

  <!-- BJMP monogram -->
  <g font-family="Arial, Helvetica, sans-serif"
     font-weight="800"
     font-size="265"
     letter-spacing="-22">
    <text x="82" y="420" fill="url(#silver)">B</text>
    <text x="292" y="420" fill="url(#blue)">J</text>
    <text x="425" y="420" fill="url(#silver)">N</text>
    <text x="600" y="420" fill="url(#silver)">P</text>
  </g>

  <!-- Geometric blue accent -->
  <path d="M490 235 L545 292 L512 331 L457 274 Z" fill="url(#blue)"/>
  <path d="M512 331 L560 278 L588 309 L538 361 Z" fill="#08D8FF" opacity=".9"/>
</svg>
